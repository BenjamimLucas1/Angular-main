<form (submit)="cadastrarProduto($event)">

    <!-- Input do título -->
    <input type="text" placeholder="Título" [formField]="produtoForm.titulo">

    <!-- Input da descrição -->
    <input type="text" placeholder="Descrição" [formField]="produtoForm.descricao">

    <!-- Input do preço -->
    <input type="text" placeholder="Preço" inputmode="numeric" [formField]="produtoForm.preco">

    <button>Cadastrar produto</button>

</form>

@for (produto of produtos(); track produto.titulo) {
    <h1>{{produto.titulo}}</h1>
    <p>{{produto.descricao}}</p>
    <p>{{produto.preco}}</p>
} @empty {
    <p>Não há itens disponíveis</p>
}
